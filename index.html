<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Flota v2</title>
<meta name="theme-color" content="#222b33">
<style>
:root{
  --bg:#eef0ee;--card:#ffffff;--ink:#222b33;--muted:#6a747d;--line:#dde1de;
  --btn:#222b33;--btn-ink:#ffffff;--soft:#e6e9e6;
  --bad:#b3261e;--bad-bg:#fbe3e0;--warn:#a3480a;--warn-bg:#fde8d2;
  --soft-c:#7a5b00;--soft-bg:#fbf0c4;--ok:#1d6b3a;--ok-bg:#dcf1e2;--info:#1f4a8a;--info-bg:#dde8f8;
  --plate-band:#1f4a8a;
  color-scheme:light dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14181c;--card:#1e252b;--ink:#e8ecef;--muted:#98a3ac;--line:#2d363d;
    --btn:#e8ecef;--btn-ink:#14181c;--soft:#28313a;
    --bad:#ff9d94;--bad-bg:#43201d;--warn:#ffb877;--warn-bg:#41290f;
    --soft-c:#f3d46a;--soft-bg:#3b3210;--ok:#8fd8a8;--ok-bg:#183a25;--info:#9cc0f5;--info-bg:#1b2d4a;
  }
}
:root[data-theme="dark"]{
  --bg:#14181c;--card:#1e252b;--ink:#e8ecef;--muted:#98a3ac;--line:#2d363d;
  --btn:#e8ecef;--btn-ink:#14181c;--soft:#28313a;
  --bad:#ff9d94;--bad-bg:#43201d;--warn:#ffb877;--warn-bg:#41290f;
  --soft-c:#f3d46a;--soft-bg:#3b3210;--ok:#8fd8a8;--ok-bg:#183a25;--info:#9cc0f5;--info-bg:#1b2d4a;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
button,input,select,textarea{font:inherit;color:inherit;}
.app{max-width:640px;margin:0 auto;padding:16px 14px 110px;}
h1{font-size:26px;margin:4px 0 2px;letter-spacing:-.02em;}
h2{font-size:17px;margin:22px 0 8px;}
.sub{color:var(--muted);font-size:14px;margin:0 0 14px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;}
.row{display:flex;align-items:center;gap:10px;}
.row.top{align-items:flex-start;}
.grow{flex:1;min-width:0;}
.between{justify-content:space-between;}
.muted{color:var(--muted);}
.small{font-size:13px;}
.right{text-align:right;}
.tap{cursor:pointer;}
.tap:active{background:var(--soft);}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
.kpi .n{font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.kpi .l{font-size:13px;color:var(--muted);}
.kpi.bad .n{color:var(--bad);}
.kpi.warn .n{color:var(--warn);}
.plate{display:inline-block;background:#fff;color:#111;border:2px solid #222;border-top:6px solid var(--plate-band);border-radius:5px;padding:0 8px;font-weight:800;letter-spacing:.08em;font-size:16px;line-height:1.35;white-space:nowrap;}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;}
.b-bad{background:var(--bad-bg);color:var(--bad);}
.b-warn{background:var(--warn-bg);color:var(--warn);}
.b-soft{background:var(--soft-bg);color:var(--soft-c);}
.b-ok{background:var(--ok-bg);color:var(--ok);}
.b-info{background:var(--info-bg);color:var(--info);}
.b-mute{background:var(--soft);color:var(--muted);}
.btn{border:0;background:var(--btn);color:var(--btn-ink);padding:10px 16px;border-radius:10px;font-weight:600;cursor:pointer;}
.btn.sec{background:var(--soft);color:var(--ink);}
.btn.sm{padding:6px 12px;font-size:14px;border-radius:8px;}
.btn.danger{background:var(--bad-bg);color:var(--bad);}
.btn.armed{background:var(--bad);color:#fff;}
.btn.block{width:100%;}
a.btn{display:inline-block;text-decoration:none;}
.bar{display:flex;gap:8px;margin-bottom:12px;}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;}
textarea{min-height:70px;resize:vertical;}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--info);outline-offset:1px;}
label.f{display:block;margin:0 0 12px;font-size:14px;font-weight:600;}
label.f>span{display:block;margin-bottom:4px;}
label.f small{font-weight:400;color:var(--muted);}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);}
.chk input{width:22px;height:22px;min-height:0;flex:none;}
.empty{text-align:center;padding:30px 16px;color:var(--muted);}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px;}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5;}
nav button{flex:1;background:none;border:0;padding:6px 2px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;position:relative;}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
nav button.on{color:var(--ink);font-weight:700;}
nav button.on::before{content:"";position:absolute;top:-7px;left:25%;right:25%;height:3px;border-radius:0 0 3px 3px;background:var(--ink);}
nav .dot{position:absolute;top:2px;left:calc(50% + 8px);background:var(--bad);color:#fff;font-size:11px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;}
#modal,#modal2{display:none;position:fixed;inset:0;z-index:10;}
#modal2{z-index:12;}
#modal.open,#modal2.open{display:block;}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.45);}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:var(--bg);border-radius:18px 18px 0 0;max-height:92%;overflow:auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));animation:up .18s ease-out;}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h3{margin:0 0 12px;font-size:20px;}
.sec-t{font-weight:700;margin:16px 0 8px;font-size:15px;}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:20;font-size:14px;max-width:90%;}
.loading{padding:60px 0;text-align:center;color:var(--muted);}
.scroll-x{overflow-x:auto;}
.paste{border:1px dashed var(--line);border-radius:10px;padding:12px;min-height:52px;background:var(--card);margin-bottom:10px;}
.paste:empty:before{content:attr(data-ph);color:var(--muted);font-size:14px;}
.login{max-width:380px;margin:12vh auto 0;}
.viewer#cam{max-height:45vh;}
.viewer{width:100%;max-height:70vh;object-fit:contain;border-radius:10px;background:var(--soft);}
.filebtn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;}
.filebtn input{position:absolute;inset:0;width:100%;height:100%;min-height:0;opacity:0;cursor:pointer;font-size:0;padding:0;border:0;}
.fthumb{width:44px;height:44px;border-radius:6px;object-fit:cover;flex:none;background:var(--soft);}
.fpdf{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--bad);}
.mode{font-size:12px;color:var(--muted);margin-top:18px;text-align:center;}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav id="nav"></nav>
<div id="modal"></div>
<div id="modal2"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============ CONFIGURACIÓN: completá estos dos datos ============ */
const SUPABASE_URL='https://hnwibidwnqzmxixaivkw.supabase.co';
const SUPABASE_KEY='sb_publishable_DOIBrdkkn6mFgwqQoSq_Vg_7mZas3yS';
const BUCKET='documentos';
/* ================================================================== */

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$ '+Math.round(n||0).toLocaleString('es-AR');
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d;};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse=s=>{if(!s)return null;const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const days=(a,b)=>Math.round((b-a)/864e5);
const fdate=s=>{if(!s)return '';const p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0];};
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const num1=n=>(Math.round(n*10)/10).toLocaleString('es-AR');

const TIPOS={alquiler:'Alquilado',financiado:'Financiado',disponible:'Disponible',taller:'En taller'};
const DOCS=[['dni','DNI (frente y dorso)'],['lic','Licencia profesional'],['dom','Comprobante de domicilio'],['ant','Certificado de antecedentes'],['app','Alta en la app (Uber, Cabify, etc.)'],['contrato','Contrato firmado'],['garante','Garante / aval']];
const VENC=[['vtv','VTV'],['seguro','Seguro'],['impuesto','Impuesto automotor (fecha de vencimiento)'],['cedula','Cédula / tarjeta']];
const COLS=['cars','drivers','payments'];
function normCar(c){
  /* corrige autos guardados con un bug anterior: la patente quedó reemplazada por una fecha */
  if(/^\d{4}-\d{2}-\d{2}$/.test(c.patente||'')){if(!c.impuesto)c.impuesto=c.patente;c.patente='';}
  return c;
}
const DCATS=[...DOCS.map(x=>[x[0],x[1].replace(/ \(.*\)/,'')]),['otro','Otro']];
const CCATS=[['cedula','Cédula / tarjeta'],['titulo','Título / boleto de compra'],['seguro','Póliza de seguro'],['vtv','VTV'],['patente','Comprobante de impuesto automotor'],['contrato','Contrato'],['fotos','Fotos del auto'],['otro','Otro']];
const ACCEPT=['image/jpeg','image/png','image/webp','image/gif','application/pdf'];

/* ---------- estado y datos ---------- */
const S={cars:[],drivers:[],payments:[],ready:false,user:null,chan:null};
const ui={tab:'panel',qCars:'',qDrivers:'',filterCar:''};
let sb=null,dl=null,as=null;
const configured=()=>!/PEGAR_AQUI/.test(SUPABASE_URL+SUPABASE_KEY);

function rowOf(obj){const d=Object.assign({},obj);delete d.id;return{id:obj.id,data:d,updated_at:new Date().toISOString()};}
function putLocal(col,obj){const i=S[col].findIndex(x=>x.id===obj.id);if(i>=0)S[col][i]=obj;else S[col].push(obj);}

async function fetchAll(col){
  const out=[];const step=1000;
  for(let from=0;;from+=step){
    const r=await sb.from(col).select('id,data').order('id').range(from,from+step-1);
    if(r.error)throw r.error;
    out.push(...r.data);
    if(r.data.length<step)break;
  }
  return out.map(x=>Object.assign({id:x.id},x.data||{}));
}
async function load(col){
  try{
    let rows=await fetchAll(col);
    if(col==='cars')rows=rows.map(normCar);
    S[col]=rows;return true;
  }catch(e){toast('No se pudieron cargar los datos ('+((e&&e.message)||'error')+')');return false;}
}
async function save(col,obj){
  const r=await sb.from(col).upsert(rowOf(obj));
  if(r.error){toast('No se pudo guardar: '+r.error.message);return false;}
  putLocal(col,obj);render();return true;
}
async function saveMany(col,arr){
  for(let i=0;i<arr.length;i+=200){
    const r=await sb.from(col).upsert(arr.slice(i,i+200).map(rowOf));
    if(r.error){toast('No se pudo restaurar: '+r.error.message);return false;}
  }
  arr.forEach(o=>putLocal(col,o));return true;
}
async function remove(col,id){
  const r=await sb.from(col).delete().eq('id',id);
  if(r.error){toast('No se pudo eliminar: '+r.error.message);return false;}
  S[col]=S[col].filter(x=>x.id!==id);render();return true;
}

/* --- sesión --- */
function viewSetup(){
  return '<div class="login"><h1>Mi Flota v2</h1><div class="card"><b>Falta configurar la conexión</b><p class="small muted">Abrí el archivo index.html y completá SUPABASE_URL y SUPABASE_KEY al principio del script, con los datos de tu proyecto de Supabase.</p></div></div>';
}
function viewLogin(){
  return '<div class="login"><h1>Mi Flota v2</h1><p class="sub">Ingresá con tu usuario</p>'+
  '<label class="f"><span>Email</span><input id="l_email" type="email" autocomplete="username" inputmode="email" autocapitalize="none"></label>'+
  '<label class="f"><span>Contraseña</span><input id="l_pass" type="password" autocomplete="current-password" onkeydown="if(event.key===\'Enter\')doLogin()"></label>'+
  '<button class="btn block" onclick="doLogin()">Entrar</button><div id="l_err" class="small" style="color:var(--bad);margin-top:10px"></div></div>';
}
async function doLogin(){
  const email=val('l_email'),password=document.getElementById('l_pass').value;
  const err=document.getElementById('l_err');
  if(!email||!password){err.textContent='Completá el email y la contraseña.';return;}
  err.textContent='Entrando…';err.style.color='var(--muted)';
  const r=await sb.auth.signInWithPassword({email,password});
  if(r.error){err.style.color='var(--bad)';err.textContent=/invalid login/i.test(r.error.message)?'Email o contraseña incorrectos.':r.error.message;}
}
async function logout(){await sb.auth.signOut();}
async function start(){
  S.ready=false;render();
  await Promise.all(COLS.map(load));
  S.ready=true;render();
  if(!S.chan){
    S.chan=sb.channel('flota');
    const timers={};
    COLS.forEach(c=>S.chan.on('postgres_changes',{event:'*',schema:'public',table:c},()=>{
      clearTimeout(timers[c]);timers[c]=setTimeout(async()=>{await load(c);render();},300);
    }));
    S.chan.subscribe();
  }
}
function stop(){
  if(S.chan){try{sb.removeChannel(S.chan);}catch(e){}S.chan=null;}
  COLS.forEach(c=>S[c]=[]);S.ready=false;
}

/* --- archivos en Supabase Storage --- */
function makeStorage(){
  const B=()=>sb.storage.from(BUCKET);
  return{
    async upload(blob){
      const ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif','application/pdf':'pdf'}[blob.type]||'bin';
      const path=new Date().getFullYear()+'/'+uid()+uid()+'.'+ext;
      const r=await B().upload(path,blob,{contentType:blob.type,upsert:false});
      if(r.error){throw new Error(r.error.message||'error');}
      return{id:path,contentType:blob.type,sizeBytes:blob.size};
    },
    async delete(path){const r=await B().remove([path]);if(r.error)throw r.error;return{deleted:true};}
  };
}
function hydrateThumbs(root){
  root.querySelectorAll('img[data-path]').forEach(async img=>{
    try{const r=await sb.storage.from(BUCKET).createSignedUrl(img.dataset.path,3600);if(r.data&&r.data.signedUrl)img.src=r.data.signedUrl;}catch(e){}
  });
}

async function init(){
  render();
  if(!configured())return;
  if(!window.supabase){$('#app').innerHTML='<div class="login"><h1>Mi Flota v2</h1><div class="card">No se pudo cargar la conexión. Revisá tu internet y recargá la página.</div></div>';return;}
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  as=makeStorage();
  const g=await sb.auth.getSession();
  S.user=(g.data&&g.data.session)?g.data.session.user:null;
  sb.auth.onAuthStateChange((ev,session)=>{
    const u=session?session.user:null;
    const changed=(u&&u.id)!==(S.user&&S.user.id);
    S.user=u;
    if(changed)setTimeout(()=>{if(u)start();else{stop();render();}},0);
  });
  if(S.user)start();else render();
}

/* ---------- cálculos ---------- */
const isContract=c=>c.tipo==='alquiler'||c.tipo==='financiado';
function calc(c){
  const r={debt:0,late:0,paid:0,due:0,weeks:0,saldo:null,total:0};
  if(!isContract(c)||!c.inicio||!c.monto)return r;
  const d=days(parse(c.inicio),today());
  if(d<0)return r;
  let weeks=Math.floor(d/7)+1;
  const kind=c.tipo==='alquiler'?'alquiler':'cuota';
  if(c.tipo==='financiado'&&c.cuotas)weeks=Math.min(weeks,+c.cuotas);
  const paid=S.payments.filter(p=>p.carId===c.id&&p.tipo===kind&&p.fecha>=c.inicio).reduce((a,p)=>a+(+p.monto||0),0);
  r.weeks=weeks;r.paid=paid;r.due=weeks*c.monto;
  r.debt=Math.max(0,r.due-paid);r.late=r.debt/c.monto;
  if(c.tipo==='financiado'){r.total=+c.total||c.monto*(+c.cuotas||0);r.saldo=Math.max(0,r.total-paid);}
  return r;
}
function vs(f){
  if(!f)return null;
  const d=days(today(),parse(f));
  if(d<0)return{d,cls:'bad',t:'Vencido hace '+(-d)+' d'};
  if(d===0)return{d,cls:'bad',t:'Vence hoy'};
  if(d<=15)return{d,cls:'warn',t:'Vence en '+d+' d'};
  if(d<=30)return{d,cls:'soft',t:'Vence en '+d+' d'};
  return{d,cls:'ok',t:'Vence '+fdate(f)};
}
function alerts(){
  const out=[];
  S.cars.forEach(c=>VENC.forEach(([k,l])=>{const s=vs(c[k]);if(s)out.push(Object.assign({who:c.patente||'Auto sin patente',sub:l,kind:'car',id:c.id},s));}));
  S.drivers.forEach(d=>{const s=vs(d.licVenc);if(s)out.push(Object.assign({who:d.nombre,sub:'Licencia',kind:'driver',id:d.id},s));});
  return out.sort((a,b)=>a.d-b.d);
}
const urgent=()=>alerts().filter(a=>a.d<=15);
const driverName=id=>{const d=S.drivers.find(x=>x.id===id);return d?d.nombre:'';};
const carById=id=>S.cars.find(x=>x.id===id);
function driverDebt(id){
  return S.cars.filter(c=>c.choferId===id&&isContract(c)).reduce((a,c)=>a+calc(c).debt,0);
}
const plate=p=>'<span class="plate">'+esc(p||'Sin patente')+'</span>';
const badge=(cls,t)=>'<span class="badge b-'+cls+'">'+esc(t)+'</span>';
const tipoBadge=t=>badge(t==='alquiler'?'info':t==='financiado'?'ok':'mute',TIPOS[t]||t);

/* ---------- navegación ---------- */
const ICONS={
  panel:'<path d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-4H4zM14 8h6V4h-6z"/>',
  autos:'<path d="M5 16v-4l2-5h10l2 5v4M3 16h18M7 19v-3M17 19v-3M7.5 12h9"/>',
  choferes:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  cobros:'<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 9v.01M18 15v.01"/>',
  venc:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16M12 13v3l2 1"/>'
};
function renderNav(){
  if(!configured()||!S.user){$('#nav').innerHTML='';return;}
  const n=urgent().length;
  const items=[['panel','Panel'],['autos','Autos'],['choferes','Choferes'],['cobros','Cobros'],['venc','Vencimientos']];
  $('#nav').innerHTML=items.map(([k,l])=>'<button class="'+(ui.tab===k?'on':'')+'" onclick="go(\''+k+'\')"><svg viewBox="0 0 24 24">'+ICONS[k]+'</svg>'+l+(k==='venc'&&n?'<span class="dot">'+n+'</span>':'')+'</button>').join('');
}
function go(t){ui.tab=t;render();window.scrollTo(0,0);}
function render(){
  renderNav();
  const app=$('#app');
  if(!configured()){app.innerHTML=viewSetup();return;}
  if(!S.user){app.innerHTML=viewLogin();return;}
  if(!S.ready){app.innerHTML='<div class="loading">Cargando tu flota…</div>';return;}
  const v={panel:viewPanel,autos:viewAutos,choferes:viewChoferes,cobros:viewCobros,venc:viewVenc}[ui.tab]();
  app.innerHTML=v;
  renderList();
}
function renderList(){
  const el=$('#list');if(!el)return;
  if(ui.tab==='autos')el.innerHTML=listAutos();
  if(ui.tab==='choferes')el.innerHTML=listChoferes();
}

/* ---------- vistas ---------- */
function viewPanel(){
  const act=S.cars.filter(c=>isContract(c)&&c.choferId);
  const t0=today();
  const mes=iso(new Date(t0.getFullYear(),t0.getMonth(),1));
  const cobMes=S.payments.filter(p=>p.fecha>=mes).reduce((a,p)=>a+(+p.monto||0),0);
  const esperado=act.reduce((a,c)=>a+(+c.monto||0),0);
  const infos=act.map(c=>({c,i:calc(c)}));
  const deuda=infos.reduce((a,x)=>a+x.i.debt,0);
  const saldoFin=S.cars.filter(c=>c.tipo==='financiado').reduce((a,c)=>a+(calc(c).saldo||0),0);
  const urg=urgent();
  if(!S.cars.length&&!S.drivers.length){
    return '<h1>Mi Flota v2</h1><p class="sub">Autos, choferes, cobros y vencimientos en un solo lugar.</p>'+
    '<div class="card empty"><b>Empecemos por lo básico</b>Cargá tus choferes y tus autos. Después registrás cada cobro semanal y la app te dice quién debe y qué vence.<div style="margin-top:16px" class="row" ><button class="btn grow" onclick="driverForm()">Cargar chofer</button><button class="btn grow" onclick="carForm()">Cargar auto</button></div></div>'+backupCard();
  }
  const morosos=infos.filter(x=>x.i.debt>0).sort((a,b)=>b.i.debt-a.i.debt).slice(0,5);
  let h='<h1>Mi Flota v2</h1><p class="sub">'+t0.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})+'</p>';
  h+='<div class="grid">'+
    '<div class="kpi"><div class="n">'+money(cobMes)+'</div><div class="l">Cobrado este mes</div></div>'+
    '<div class="kpi"><div class="n">'+money(esperado)+'</div><div class="l">Esperado por semana</div></div>'+
    '<div class="kpi '+(deuda>0?'bad':'')+'"><div class="n">'+money(deuda)+'</div><div class="l">Deuda de choferes</div></div>'+
    '<div class="kpi"><div class="n">'+money(saldoFin)+'</div><div class="l">Falta cobrar de financiados</div></div>'+
    '<div class="kpi"><div class="n">'+act.length+' de '+S.cars.length+'</div><div class="l">Autos en la calle</div></div>'+
    '<div class="kpi '+(urg.length?'warn':'')+' tap" onclick="go(\'venc\')"><div class="n">'+urg.length+'</div><div class="l">Vencimientos urgentes</div></div>'+
  '</div>';
  h+='<h2>Choferes con deuda</h2>';
  if(!morosos.length)h+='<div class="card muted">Nadie debe nada. Todo al día.</div>';
  morosos.forEach(x=>{
    h+='<div class="card tap row" onclick="payForm(\''+x.c.id+'\')"><div class="grow"><div>'+esc(driverName(x.c.choferId)||'Sin chofer')+'</div><div class="small muted">'+plate(x.c.patente)+'</div></div><div class="right"><div style="font-weight:700;color:var(--bad)">'+money(x.i.debt)+'</div><div class="small muted">'+num1(x.i.late)+' sem. de atraso</div></div></div>';
  });
  h+='<h2>Vencimientos urgentes</h2>';
  if(!urg.length)h+='<div class="card muted">Nada vence en los próximos 15 días.</div>';
  urg.slice(0,6).forEach(a=>{h+=alertRow(a);});
  if(urg.length>6)h+='<button class="btn sec block" onclick="go(\'venc\')">Ver los '+urg.length+'</button>';
  return h+backupCard();
}

/* ---------- modales ---------- */
function openModal(html){
  renderFiles._tried=0;
  $('#modal').innerHTML='<div class="scrim" onclick="closeModal()"></div><div class="sheet" role="dialog" aria-modal="true">'+html+'</div>';
  $('#modal').classList.add('open');document.body.style.overflow='hidden';
}
function closeModal(){$('#modal').classList.remove('open');$('#modal').innerHTML='';document.body.style.overflow='';}
let toastT;
function toast(m){
  let t=$('.toast');if(t)t.remove();
  t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);
  clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),3200);
}
let armed=null;
function confirmDel(btn,fn){
  if(armed&&armed.btn===btn){clearTimeout(armed.t);armed=null;fn();return;}
  if(armed){clearTimeout(armed.t);armed.btn.textContent=armed.txt;armed.btn.classList.remove('armed');}
  const txt=btn.textContent;btn.textContent='¿Seguro? Tocá de nuevo';btn.classList.add('armed');
  armed={btn,txt,t:setTimeout(()=>{btn.textContent=txt;btn.classList.remove('armed');armed=null;},4000)};
}

function onTipo(el,init){
  const t=el.value,con=t==='alquiler'||t==='financiado';
  $('#contrato').style.display=con?'':'none';
  $('#finbox').style.display=t==='financiado'?'':'none';
  $('#lblmonto').textContent=t==='financiado'?'Cuota semanal':'Alquiler semanal';
  if(!init&&con&&el.value!==el.dataset.orig)$('#c_inicio').value=iso(today());
}
function autoCuota(){
  const m=$('#c_monto');if(m.dataset.touched)return;
  const t=+val('c_total'),n=+val('c_cuotas');
  if(t&&n)m.value=Math.round(t/n);
}
async function saveCar(id){
  const patente=val('c_patente').toUpperCase();
  if(!patente){toast('Falta la patente');return;}
  const tipo=val('c_tipo'),con=tipo==='alquiler'||tipo==='financiado';
  const o={id:id||uid(),patente,marca:val('c_marca'),modelo:val('c_modelo'),anio:val('c_anio'),tipo,
    choferId:con?val('c_chofer'):'',monto:con?(+val('c_monto')||0):0,inicio:con?val('c_inicio'):'',
    total:tipo==='financiado'?(+val('c_total')||0):0,cuotas:tipo==='financiado'?(+val('c_cuotas')||0):0,notas:val('c_notas'),
    files:((S.cars.find(x=>x.id===id)||{}).files)||[]};
  VENC.forEach(v=>{o[v[0]]=val('v_'+v[0]);});
  if(con){
    if(!o.choferId){toast('Elegí el chofer (cargalo primero en Choferes)');return;}
    if(!o.monto||!o.inicio){toast('Completá el monto semanal y la fecha de inicio');return;}
    if(tipo==='financiado'&&!o.cuotas){toast('Completá la cantidad de cuotas');return;}
  }
  if(await save('cars',o)){closeModal();toast('Auto guardado');}
}
async function delCar(id){
  await purgeFiles(S.cars.find(x=>x.id===id));
  for(const p of S.payments.filter(p=>p.carId===id))await remove('payments',p.id);
  if(await remove('cars',id)){closeModal();toast('Auto eliminado');}
}

async function saveDriver(id){
  const nombre=val('d_nombre');
  if(!nombre){toast('Falta el nombre');return;}
  const docs={};DOCS.forEach(x=>{docs[x[0]]=document.getElementById('dc_'+x[0]).checked;});
  const o={id:id||uid(),nombre,dni:val('d_dni'),licVenc:val('d_lic'),tel:val('d_tel'),domicilio:val('d_dom'),notas:val('d_notas'),docs,files:((S.drivers.find(x=>x.id===id)||{}).files)||[]};
  if(await save('drivers',o)){closeModal();toast('Chofer guardado');}
}
async function delDriver(id){
  await purgeFiles(S.drivers.find(x=>x.id===id));
  for(const c of S.cars.filter(c=>c.choferId===id))await save('cars',Object.assign({},c,{choferId:'',tipo:'disponible'}));
  if(await remove('drivers',id)){closeModal();toast('Chofer eliminado');}
}

/* --- cobro --- */
function payForm(carId){
  const cars=S.cars.filter(c=>isContract(c)&&c.choferId);
  if(!cars.length){toast('Primero cargá un auto alquilado o financiado con chofer');return;}
  const c=cars.find(x=>x.id===carId)||cars[0];
  const h='<h3>Registrar cobro</h3>'+
  '<label class="f"><span>Auto</span><select id="p_car" onchange="onPayCar()">'+cars.map(x=>'<option value="'+x.id+'"'+(x.id===c.id?' selected':'')+'>'+esc(x.patente)+' · '+esc(driverName(x.choferId))+'</option>').join('')+'</select></label>'+
  '<div class="small muted" id="p_info" style="margin:-4px 0 12px"></div>'+
  '<div class="two"><label class="f"><span>Monto</span><input id="p_monto" inputmode="decimal"></label>'+
  '<label class="f"><span>Fecha</span><input id="p_fecha" type="date" value="'+iso(today())+'"></label></div>'+
  '<div class="two"><label class="f"><span>Tipo</span><select id="p_tipo"><option value="alquiler">Alquiler</option><option value="cuota">Cuota de financiación</option><option value="otro">Otro (anticipo, multa, etc.)</option></select></label>'+
  '<label class="f"><span>Nota</span><input id="p_nota"></label></div>'+
  '<div class="row"><button class="btn grow" onclick="savePay()">Guardar cobro</button><button class="btn sec" onclick="closeModal()">Cancelar</button></div>';
  openModal(h);onPayCar();
}
function onPayCar(){
  const c=carById($('#p_car').value);if(!c)return;
  const i=calc(c);
  $('#p_monto').value=c.monto||'';
  $('#p_tipo').value=c.tipo==='alquiler'?'alquiler':'cuota';
  $('#p_info').textContent=(i.debt>0?'Debe '+money(i.debt)+' ('+num1(i.late)+' semanas). ':'Está al día. ')+(c.tipo==='alquiler'?'Alquiler':'Cuota')+' semanal: '+money(c.monto)+'.';
}
async function savePay(){
  const c=carById(val('p_car'));const monto=+val('p_monto');
  if(!c){toast('Elegí un auto');return;}
  if(!monto||monto<=0){toast('Poné el monto cobrado');return;}
  if(!val('p_fecha')){toast('Poné la fecha');return;}
  const o={id:uid(),carId:c.id,choferId:c.choferId,fecha:val('p_fecha'),monto,tipo:val('p_tipo'),nota:val('p_nota')};
  if(await save('payments',o)){closeModal();toast('Cobro registrado');}
}
async function delPay(id){if(await remove('payments',id))toast('Cobro borrado');}

/* --- archivos --- */
async function purgeFiles(e){
  if(!as||!e||!e.files)return;
  for(const f of e.files){if(f.link)continue;try{await as.delete(f.id);}catch(x){}}
}
async function patchDoc(col,id,patch){
  const cur=S[col].find(x=>x.id===id);
  if(!cur){toast('No se encontró el registro.');return false;}
  const o=Object.assign({},cur);
  for(const k in patch)o[k]=k==='docs'?Object.assign({},o.docs||{},patch.docs):patch[k];
  const r=await sb.from(col).upsert(rowOf(o));
  if(r.error){toast('No se pudo guardar el archivo ('+r.error.message+')');return false;}
  putLocal(col,o);render();return true;
}
function renderFiles(col,id){
  const el=$('#files');if(!el)return;
  if(!id){el.innerHTML='<div class="small muted" style="margin-bottom:12px">Guardá primero y después podés adjuntar fotos, PDF o links.</div>';return;}
  const prev=$('#f_cat')?$('#f_cat').value:'';
  const e=S[col].find(x=>x.id===id);const F=(e&&e.files)||[];
  const cats=col==='drivers'?DCATS:CCATS;
  const label=k=>(cats.find(c=>c[0]===k)||[0,'Archivo'])[1];
  let h=F.length?F.map(f=>{
    const img=!f.link&&(f.type||'').startsWith('image/');
    const open=f.link?'window.open(\''+esc(f.link)+'\',\'_blank\')':'viewFile(\''+esc(f.id)+'\',\''+esc(f.name)+'\')';
    return '<div class="card row"><div class="row grow tap" onclick="'+open+'">'+
    (img?'<img class="fthumb" alt="" data-path="'+esc(f.id)+'">':'<div class="fthumb fpdf">'+(f.link?'LINK':'PDF')+'</div>')+
    '<div class="grow" style="overflow-wrap:anywhere"><div>'+esc(label(f.cat))+'</div><div class="small muted">'+esc(f.name)+' · '+fdate(f.fecha)+'</div></div></div>'+
    ((as||f.link)?'<button class="btn danger sm" onclick="confirmDel(this,()=>delFile(\''+col+'\',\''+id+'\',\''+esc(f.id)+'\'))">Quitar</button>':'')+'</div>';
  }).join(''):'<div class="small muted" style="margin-bottom:8px">Todavía no hay archivos.</div>';
  h+='<label class="f"><span>Categoría</span><select id="f_cat">'+cats.map(c=>'<option value="'+c[0]+'">'+esc(c[1])+'</option>').join('')+'</select></label>';
  if(as){
    h+='<div class="two" style="margin-bottom:10px">'+
      '<label class="btn sec filebtn">Elegir archivo<input id="fileIn" type="file" accept="image/*,application/pdf" onchange="attach(\''+col+'\',\''+id+'\')"></label>'+
      '<button class="btn sec" onclick="liveCam(\''+col+'\',\''+id+'\')">Sacar foto</button></div>'+
      '<div class="paste" contenteditable="true" data-ph="Tocá acá y pegá una foto copiada" onpaste="onPaste(event,\''+col+'\',\''+id+'\')" oninput="this.innerHTML=\'\'"></div>';
  }else{
    h+='<div class="small muted" style="margin-bottom:10px">Subir archivos no está disponible en esta vista.</div>';
    if(!renderFiles._t&&!renderFiles._tried){renderFiles._t=1;renderFiles._tried=1;getAssets().then(a=>{renderFiles._t=0;if(a)renderFiles(col,id);else diag().then(t=>fstat(t));});}
  }
  h+='<div class="small muted" style="margin-bottom:6px">También podés pegar el link de un archivo guardado en Drive o Dropbox.</div>'+
    '<div class="two" style="margin-bottom:12px"><input id="f_link" type="url" inputmode="url" placeholder="https://…"><button class="btn sec" onclick="addLink(\''+col+'\',\''+id+'\')">Guardar link</button></div>';
  el.innerHTML=h;hydrateThumbs(el);
  if(prev&&$('#f_cat'))$('#f_cat').value=prev;
}
let camStream=null;
async function liveCam(col,id){
  const m=$('#modal2');
  m.innerHTML='<div class="scrim" onclick="closeCam()"></div><div class="sheet"><h3>Sacar foto</h3><div id="camBox" class="small muted">Pidiendo permiso a la cámara…</div>'+
    '<div class="row" style="margin-top:12px"><button class="btn grow" id="shot" disabled onclick="shoot(\''+col+'\',\''+id+'\')">Capturar</button><button class="btn sec" onclick="closeCam()">Cerrar</button></div></div>';
  m.classList.add('open');
  try{
    camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    const box=document.getElementById('camBox');
    box.innerHTML='<video id="cam" class="viewer" autoplay playsinline muted></video>';
    const v=document.getElementById('cam');v.srcObject=camStream;
    try{const pr=v.play();if(pr&&pr.catch)pr.catch(()=>{});}catch(x){}
    const btn=document.getElementById('shot');if(btn)btn.disabled=false;
  }catch(e){
    const n=(e&&e.name)||'';
    const msg=n==='NotAllowedError'?'No se dio permiso para usar la cámara. Habilitalo para Claude en los ajustes del celular, o pegá una foto copiada en el recuadro.':
      n==='NotFoundError'?'No se encontró ninguna cámara en este dispositivo.':
      'No se pudo abrir la cámara acá ('+(n||'error')+'). Probá pegar una foto copiada, o abrir la app desde el navegador del celular.';
    const box=document.getElementById('camBox');if(box){box.textContent=msg;box.style.color='var(--bad)';}
  }
}
function closeCam(){
  if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null;}
  const m=$('#modal2');m.classList.remove('open');m.innerHTML='';
}
async function shoot(col,id){
  const v=document.getElementById('cam');if(!v)return;
  if(!v.videoWidth){toast('La cámara todavía está iniciando. Esperá un segundo y volvé a tocar Capturar.');return;}
  try{
    const cv=document.createElement('canvas');
    cv.width=v.videoWidth;cv.height=v.videoHeight;
    cv.getContext('2d').drawImage(v,0,0,cv.width,cv.height);
    const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.85));
    closeCam();
    if(!blob){fstat('No se pudo capturar la foto.',1);return;}
    try{blob.name='foto-'+iso(today())+'.jpg';}catch(x){}
    await attach(col,id,null,blob);
  }catch(e){
    fstat('Error al capturar: '+((e&&(e.name||e.message))||'desconocido'),1);
  }
}
let lastObj=null;
async function viewFile(fid,name){
  try{
    const r=await sb.storage.from(BUCKET).download(fid);
    if(r.error||!r.data)throw (r.error||new Error('sin datos'));
    const b=r.data;
    if(lastObj)URL.revokeObjectURL(lastObj);
    lastObj=URL.createObjectURL(b);
    const t=b.type||'';
    let body;
    if(t.startsWith('image/'))body='<img class="viewer" alt="'+esc(name)+'" src="'+lastObj+'">';
    else body='<div class="card"><div style="overflow-wrap:anywhere">'+esc(name)+'</div><div class="small muted">'+Math.round(b.size/1024)+' KB</div></div>';
    const m=$('#modal2');
    m.innerHTML='<div class="scrim" onclick="closeViewer()"></div><div class="sheet" role="dialog" aria-modal="true"><h3 style="overflow-wrap:anywhere">'+esc(name)+'</h3>'+body+
      '<div class="row" style="margin-top:12px"><a class="btn grow" style="text-align:center" href="'+lastObj+'" download="'+esc(name)+'" target="_blank" rel="noopener">Descargar</a>'+
      '<button class="btn sec" onclick="closeViewer()">Cerrar</button></div></div>';
    m.classList.add('open');
  }catch(e){
    toast('No se pudo abrir el archivo. Puede que se haya borrado.');
  }
}
function closeViewer(){
  const m=$('#modal2');m.classList.remove('open');m.innerHTML='';
  if(lastObj){URL.revokeObjectURL(lastObj);lastObj=null;}
}
async function addLink(col,id){
  const u=val('f_link');
  if(!/^https?:\/\/\S+$/i.test(u)){fstat('Pegá un link que empiece con https://',1);return;}
  const cat=val('f_cat');
  const cur=S[col].find(x=>x.id===id);
  const files=((cur&&cur.files)||[]).concat([{id:uid(),name:u.replace(/^https?:\/\//i,'').slice(0,60),cat,link:u,fecha:iso(today())}]);
  const patch={files};
  const tick=col==='drivers'&&DOCS.some(x=>x[0]===cat);
  if(tick)patch.docs={[cat]:true};
  if(!(await patchDoc(col,id,patch)))return;
  if(tick){const cb=document.getElementById('dc_'+cat);if(cb)cb.checked=true;}
  renderFiles(col,id);fstat('Listo: link guardado.');
}
async function shrink(f){
  try{
    const bmp=await createImageBitmap(f);
    const k=Math.min(1,2000/Math.max(bmp.width,bmp.height));
    if(k===1&&f.type==='image/jpeg'&&f.size<1.5e6)return f;
    const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*k);cv.height=Math.round(bmp.height*k);
    cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
    const b=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.85));
    if(!b)return f;
    return(ACCEPT.includes(f.type)&&b.size>=f.size)?f:b;
  }catch(e){return f;}
}
function guessType(f){
  if(f.type)return f.type;
  const e=((f.name||'').split('.').pop()||'').toLowerCase();
  return{jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',webp:'image/webp',gif:'image/gif',pdf:'application/pdf',heic:'image/heic'}[e]||'';
}
function fstat(m,bad){
  const el=document.getElementById('fstatus');
  if(el){el.textContent=m;el.style.color=bad?'var(--bad)':'var(--muted)';}
  if(bad)toast(m);
}
async function getAssets(){return as;}
async function diag(){return 'Sesión: '+(S.user?'iniciada':'no iniciada');}
async function onPaste(ev,col,id){
  const it=(ev.clipboardData&&ev.clipboardData.items)||[];
  for(const i of it){
    if(i.kind==='file'){const f=i.getAsFile();if(f){ev.preventDefault();await attach(col,id,null,f);ev.target.innerHTML='';return;}}
  }
  ev.preventDefault();fstat('No había ninguna imagen copiada. Copiá la foto y volvé a pegar.',1);
}
async function attach(col,id,inputId,blobIn){
  const inp=document.getElementById(inputId||'fileIn');
  const f=blobIn||(inp&&inp.files&&inp.files[0]);
  if(!f){fstat('No se eligió ningún archivo.',1);return;}
  try{
    if(!(await getAssets())){fstat('Adjuntar no está disponible en esta vista. '+await diag(),1);return;}
    const cat=val('f_cat');const ft=guessType(f);
    if(inp)inp.value='';
    fstat('Archivo elegido: '+(f.name||'imagen')+' ('+Math.round(f.size/1024)+' KB). Preparando…');
    let blob=f;
    if(ft.startsWith('image/')&&ft!=='image/gif')blob=await shrink(f);
    else if(!f.type&&ft)blob=f.slice(0,f.size,ft);
    if(!ACCEPT.includes(blob.type)){fstat('Formato no admitido ('+(blob.type||ft||'desconocido')+'). Usá foto JPG o PNG, o PDF.',1);return;}
    fstat('Subiendo '+Math.round(blob.size/1024)+' KB…');
    let r;
    try{r=await as.upload(blob);}
    catch(e){
      fstat('No se pudo subir el archivo: '+((e&&e.message)||'error'),1);return;
    }
    const cur=S[col].find(x=>x.id===id);
    const files=((cur&&cur.files)||[]).concat([{id:r.id,name:f.name||('foto-'+iso(today())+'.jpg'),cat,type:r.contentType,size:r.sizeBytes,fecha:iso(today())}]);
    const patch={files};
    const tick=col==='drivers'&&DOCS.some(x=>x[0]===cat);
    if(tick)patch.docs={[cat]:true};
    if(!(await patchDoc(col,id,patch))){try{await as.delete(r.id);}catch(x){}fstat('El archivo se subió pero no se pudo guardar en la ficha. Probá de nuevo.',1);return;}
    if(tick){const cb=document.getElementById('dc_'+cat);if(cb)cb.checked=true;}
    renderFiles(col,id);fstat('Listo: archivo adjuntado.');
  }catch(e){
    fstat('Error al adjuntar: '+((e&&(e.code||e.message))||'desconocido'),1);
  }
}
async function delFile(col,id,fid){
  const e=S[col].find(x=>x.id===id);if(!e)return;
  const f=(e.files||[]).find(x=>x.id===fid);
  if(!(await patchDoc(col,id,{files:(e.files||[]).filter(x=>x.id!==fid)})))return;
  if(f&&!f.link&&as){try{await as.delete(fid);}catch(x){}}
  renderFiles(col,id);toast('Archivo quitado');
}

/* --- copia de seguridad --- */
let pendingRestore=null;
async function saveFile(filename,data,type){
  if(dl){await dl.save({filename,data});return;}
  const b=new Blob([data],{type:type||'text/plain'});
  const u=URL.createObjectURL(b);
  const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);
}
async function backup(){
  const data={app:'mi-flota',version:1,fecha:new Date().toISOString(),cars:S.cars,drivers:S.drivers,payments:S.payments};
  try{await saveFile('copia-flota-'+iso(today())+'.json',JSON.stringify(data,null,1),'application/json');toast('Copia descargada');}
  catch(e){if(!e||e.code!=='declined')toast('No se pudo descargar la copia');}
}
async function pickRestore(inp){
  const f=inp.files[0];inp.value='';if(!f)return;
  let d;
  try{d=JSON.parse(await f.text());}catch(e){toast('El archivo no es una copia válida');return;}
  if(!d||d.app!=='mi-flota'||!COLS.every(c=>Array.isArray(d[c]))){toast('Ese archivo no es una copia de Mi Flota');return;}
  pendingRestore=d;
  const fe=d.fecha?new Date(d.fecha).toLocaleDateString('es-AR'):'sin fecha';
  openModal('<h3>Restaurar copia</h3><div class="card"><div>Copia del '+esc(fe)+'</div><div class="small muted">'+d.cars.length+' autos · '+d.drivers.length+' choferes · '+d.payments.length+' cobros</div></div>'+
    '<p class="small muted">Los registros que ya existen con el mismo código se reemplazan por los de la copia. No se borra nada de lo que cargaste después.</p>'+
    '<div class="row"><button class="btn grow" onclick="doRestore()">Restaurar</button><button class="btn sec" onclick="pendingRestore=null;closeModal()">Cancelar</button></div>');
}
async function doRestore(){
  const d=pendingRestore;if(!d)return;
  pendingRestore=null;closeModal();
  const total=COLS.reduce((a,c)=>a+d[c].length,0);let n=0;
  toast('Restaurando '+total+' registros…');
  for(const c of COLS){
    let arr=d[c].filter(x=>x&&typeof x.id==='string'&&x.id);
    if(c==='cars')arr=arr.map(normCar);
    if(!(await saveMany(c,arr))){toast('Se cortó después de '+n+' de '+total+'. Probá de nuevo.');return;}
    n+=arr.length;
  }
  render();
  toast('Copia restaurada: '+n+' registros');
}

async function exportCSV(){
  const q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
  const rows=[['Fecha','Patente','Chofer','Tipo','Monto','Nota']];
  S.payments.slice().sort((a,b)=>a.fecha.localeCompare(b.fecha)).forEach(p=>{const c=carById(p.carId);rows.push([p.fecha,c?c.patente:'',driverName(p.choferId),p.tipo,p.monto,p.nota||'']);});
  const csv='\uFEFF'+rows.map(r=>r.map(q).join(',')).join('\n');
  try{await saveFile('cobros-'+iso(today())+'.csv',csv,'text/csv');}
  catch(e){if(!e||e.code!=='declined')toast('No se pudo exportar');}
}
