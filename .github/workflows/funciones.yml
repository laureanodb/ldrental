# Publica solas las funciones de Supabase cada vez que cambian en main,
# así no hay que copiarlas y pegarlas a mano en el panel de Supabase.
# Necesita el secreto SUPABASE_ACCESS_TOKEN en GitHub (Settings → Secrets and variables → Actions).
# Sin el secreto, no hace nada y lo dice.
name: Funciones de Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: hnwibidwnqzmxixaivkw
      # El bot de WhatsApp (whatsapp-webhook y whatsapp-resumen) no se publica desde acá.
      FUNCIONES: portal-chofer leer-documento postulacion usuarios-admin facturar-arca gps-webhook push-diario push-semanal backup-semanal
    steps:
      - uses: actions/checkout@v7
      - name: Revisar la clave
        id: clave
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Falta el secreto SUPABASE_ACCESS_TOKEN: las funciones no se publicaron."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.clave.outputs.ok == 'true'
        with:
          version: latest
      - name: Publicar
        if: steps.clave.outputs.ok == 'true'
        run: |
          for f in $FUNCIONES; do
            echo "Publicando $f"
            supabase functions deploy "$f" --project-ref "$SUPABASE_PROJECT_REF"
          done
